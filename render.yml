services:
  - type: web
    name: code-correction-quiz-backend
    env: node
    buildCommand: "npm install && npx prisma generate && npx prisma migrate deploy && npm run build"
    startCommand: "npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: code-correction-quiz-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://your-frontend-url.com
    databases:
      - name: code-correction-quiz-db
        databaseName: code_correction_quiz
        user: code_correction_quiz_user